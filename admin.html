<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>إدارة شركات كاش توب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
:root{--blue:#1e88e5;--nav:#0f172a;--line:#e5eaf1;--green:#16a34a;--red:#dc2626;--amber:#d97706}
.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:14px 18px;box-shadow:0 3px 20px #0f172a24}.top-inner{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#1e88e5,#60a5fa);display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand small{color:#9fb3cc}.top-actions{display:flex;gap:8px}.icon-btn{border:1px solid #ffffff28;background:#ffffff12;color:#fff;border-radius:11px;padding:10px 12px}
.wrap{max-width:1180px;margin:18px auto;padding:0 14px 50px}.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 5px 22px #0f172a0d;padding:18px}.card h2{margin:0 0 16px;font-size:18px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:800;color:#64748b;margin-bottom:6px}.field input,.field select{width:100%;height:47px;border:1px solid #d8e0e9;border-radius:12px;background:#fff;padding:0 12px;outline:0}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1e88e51a}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:13px;font-weight:900}.secondary{border:1px solid #d9e4ef;background:#f8fbff;color:#334155;border-radius:11px;padding:9px 11px;font-weight:800}.danger{color:var(--red)}.muted{color:#8ca0b4;font-size:12px}.notice{padding:11px;border-radius:11px;margin-bottom:12px;font-size:13px;font-weight:700}.notice.ok{background:#ecfdf3;color:#166534}.notice.bad{background:#fef2f2;color:#991b1b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{border:1px solid var(--line);background:#fbfdff;border-radius:14px;padding:12px}.stat span{font-size:11px;color:#94a3b8;font-weight:700}.stat strong{font-size:22px;display:block;margin-top:3px}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:12px}.toolbar input{flex:1;height:44px;border:1px solid #d8e0e9;border-radius:12px;padding:0 12px;outline:0}.companies{display:grid;gap:10px}.company{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.company-title{font-weight:900;font-size:16px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.pill{display:inline-flex;align-items:center;border-radius:999px;background:#f1f5f9;padding:5px 8px;font-size:11px;font-weight:800;color:#536477}.pill.good{background:#ecfdf3;color:#15803d}.pill.stop{background:#fff7ed;color:#c2410c}.pill.dead{background:#fef2f2;color:#b91c1c}.key{direction:ltr;font-family:ui-monospace,monospace}.company-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.company-actions button{border:1px solid #dfe7ef;background:#fff;border-radius:9px;padding:8px 9px;font-weight:800;font-size:12px}.empty{text-align:center;color:#94a3b8;padding:40px 15px}.login{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#07111f,#111f35);display:grid;place-items:center;padding:20px}.login-card{width:min(400px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 25px 80px #0006}.login-card .mark{width:68px;height:68px;margin:0 auto 15px;font-size:26px}.login-card h1{text-align:center;margin:0}.login-card p{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:22px}.secret-result{margin-top:12px;border:1px solid #bae6fd;background:#f0f9ff;border-radius:13px;padding:12px;display:none}.secret-result.show{display:block}.secret-result code{display:block;direction:ltr;text-align:left;font-size:15px;font-weight:900;word-break:break-all;margin:7px 0}.mobile-label{display:none}
@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.company{grid-template-columns:1fr}.company-actions{justify-content:stretch}.company-actions button{flex:1}.top .brand small{display:none}}
@media(max-width:430px){.wrap{padding:0 9px 40px}.card{padding:14px;border-radius:16px}.row{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:18px}.top{padding:11px}.brand h1{font-size:15px}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style>
</head>
<body>
<section id="login" class="login">
  <div class="login-card">
    <div class="mark">CT</div><h1>لوحة إدارة كاش توب</h1><p>إدارة الشركات ومفاتيح الاشتراك</p>
    <div class="field"><label>كلمة مرور الأدمن</label><input id="adminPass" type="password" autocomplete="current-password" placeholder="••••••••"></div><div style="font-size:12px;color:#94a3b8;margin:-8px 0 12px"></div>
    <button id="loginBtn" class="primary">دخول الأدمن</button><div id="loginMsg"></div>
    <div style="text-align:center;margin-top:16px"><a href="./index.html" style="color:#1e88e5;font-weight:800;text-decoration:none">العودة للتطبيق</a></div>
  </div>
</section>
<header class="top"><div class="top-inner"><div class="brand"><div class="mark">CT</div><div><h1>إدارة شركات كاش توب</h1><small>Multi-company Control</small></div></div><div class="top-actions"><button class="icon-btn" id="refreshBtn" title="تحديث">↻</button><button class="icon-btn" id="logoutBtn" title="خروج">خروج</button></div></div></header>
<main class="wrap"><div class="grid">
  <aside class="card"><h2 id="formTitle">إنشاء شركة جديدة</h2><div id="formNotice"></div>
    <form id="companyForm">
      <div class="field"><label>اسم الشركة</label><input id="companyName" required placeholder="مثال: متجر الندا"></div>
      <div class="field"><label>مفتاح مخصص (اختياري)</label><input id="companyKey" dir="ltr" placeholder="اتركه فارغاً للتوليد التلقائي"></div>
      <div class="row"><div class="field"><label>مدة الاشتراك بالأيام</label><input id="durationDays" type="number" min="1" value="30"></div><div class="field"><label>أو تاريخ انتهاء محدد</label><input id="expiresAt" type="datetime-local"></div></div>
      <button id="saveBtn" class="primary" type="submit">إنشاء الشركة والمفتاح</button>
    </form>
    <div id="secretResult" class="secret-result"><b>المفتاح الجديد — يظهر كاملاً الآن فقط:</b><code id="secretKey"></code><button id="copyKeyBtn" class="secondary" style="width:100%">نسخ المفتاح</button></div>
  </aside>
  <section class="card"><div class="stats"><div class="stat"><span>الإجمالي</span><strong id="stTotal">0</strong></div><div class="stat"><span>نشط</span><strong id="stActive">0</strong></div><div class="stat"><span>متوقف</span><strong id="stStopped">0</strong></div><div class="stat"><span>منتهي</span><strong id="stExpired">0</strong></div></div>
    <div class="toolbar"><input id="search" placeholder="بحث باسم الشركة أو جزء من المفتاح"><button id="loadBtn" class="secondary">تحديث</button></div>
    <div id="companies" class="companies"></div>
  </section>
</div></main>
<script src="./direct-cloud.js"></script>
<script>
(()=>{'use strict';
const API=(localStorage.getItem('cashtop_api_base_v4')||'/api').replace(/\/+$/,'');let token=sessionStorage.getItem('ct3_admin_token')||'';let companies=[];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(ts){if(!ts)return'—';return new Date(Number(ts)).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}function expired(c){return Date.now()>=Number(c.expires_at||c.expiresAt||0)}
async function api(path,opt={}){if(window.CashTopDirectAPI?.request){try{return await window.CashTopDirectAPI.request(path,{method:opt.method||'GET',body:opt.body,token})}catch(e){if(Number(e?.status)===401&&path!='/admin/login'){token='';sessionStorage.removeItem('ct3_admin_token');$('login').classList.remove('hidden')}throw e}}const h={...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;if(opt.body!==undefined)h['Content-Type']='application/json';const r=await fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body!==undefined?JSON.stringify(opt.body):undefined,cache:'no-store'});const d=await r.json().catch(()=>({error:'HTTP '+r.status}));if(!r.ok){if(r.status===401&&path!='/admin/login'){token='';sessionStorage.removeItem('ct3_admin_token');$('login').classList.remove('hidden')}throw new Error(d.error||'تعذر تنفيذ الطلب')}return d}
function msg(id,text,bad=false){$(id).innerHTML=text?`<div class="notice ${bad?'bad':'ok'}">${esc(text)}</div>`:''}
async function doLogin(){const p=$('adminPass').value;if(!p)return msg('loginMsg','أدخل كلمة المرور',true);$('loginBtn').disabled=true;try{const d=await api('/admin/login',{method:'POST',body:{password:p}});token=d.token;sessionStorage.setItem('ct3_admin_token',token);$('login').classList.add('hidden');$('adminPass').value='';msg('loginMsg','');await load()}catch(e){msg('loginMsg',e.message,true)}finally{$('loginBtn').disabled=false}}
async function load(){try{const d=await api('/admin/companies');companies=d.companies||[];render()}catch(e){msg('formNotice',e.message,true)}}
function statusInfo(c){if(c.status==='deleted')return['محذوف','dead'];if(expired(c))return['منتهي','dead'];if(c.status==='stopped')return['متوقف','stop'];return['نشط','good']}
function render(){const q=$('search').value.trim().toLowerCase();let list=companies.filter(c=>!q||String(c.name).toLowerCase().includes(q)||String(c.key_hint||'').toLowerCase().includes(q));$('stTotal').textContent=companies.filter(c=>c.status!=='deleted').length;$('stActive').textContent=companies.filter(c=>c.status==='active'&&!expired(c)).length;$('stStopped').textContent=companies.filter(c=>c.status==='stopped').length;$('stExpired').textContent=companies.filter(c=>c.status!=='deleted'&&expired(c)).length;
$('companies').innerHTML=list.length?list.map(c=>{const [st,cl]=statusInfo(c),isDeleted=c.status==='deleted';return `<article class="company"><div><div class="company-title">${esc(c.name)}</div><div class="meta"><span class="pill ${cl}">${st}</span><span class="pill key">${esc(c.key_hint||'••••')}</span><span class="pill">ينتهي: ${esc(fmt(c.expires_at))}</span></div><div class="muted" style="margin-top:7px">ID: <span dir="ltr">${esc(c.id)}</span></div></div><div class="company-actions">${!isDeleted?`<button onclick="renameCompany('${esc(c.id)}')">تعديل</button><button onclick="extendCompany('${esc(c.id)}')">تمديد</button><button onclick="toggleCompany('${esc(c.id)}','${c.status==='active'?'stopped':'active'}')">${c.status==='active'?'إيقاف':'تشغيل'}</button><button class="danger" onclick="deleteCompany('${esc(c.id)}')">حذف</button>`:''}</div></article>`}).join(''):'<div class="empty">لا توجد شركات مطابقة</div>'}
async function create(e){e.preventDefault();const name=$('companyName').value.trim(),key=$('companyKey').value.trim(),local=$('expiresAt').value;const body={name};if(key)body.companyKey=key;if(local)body.expiresAt=new Date(local).getTime();else body.durationDays=Number($('durationDays').value||30);$('saveBtn').disabled=true;try{const d=await api('/admin/companies',{method:'POST',body});$('secretKey').textContent=d.company.companyKey;$('secretResult').classList.add('show');$('companyForm').reset();$('durationDays').value=30;msg('formNotice','تم إنشاء الشركة. احفظ المفتاح الآن.');await load()}catch(e){msg('formNotice',e.message,true)}finally{$('saveBtn').disabled=false}}
window.toggleCompany=async(id,status)=>{if(!confirm(status==='stopped'?'إيقاف المفتاح؟ سيُرفض عند التحقق التالي.':'إعادة تشغيل المفتاح؟'))return;try{await api('/admin/companies/'+encodeURIComponent(id),{method:'PATCH',body:{status}});await load()}catch(e){alert(e.message)}};
window.deleteCompany=async id=>{if(!confirm('حذف الشركة؟ سيتم حذف المفتاح وجميع بيانات هذه الشركة نهائياً من قاعدة البيانات ولا يمكن التراجع.'))return;try{await api('/admin/companies/'+encodeURIComponent(id),{method:'DELETE'});await load()}catch(e){alert(e.message)}};
window.renameCompany=async(id)=>{const c=companies.find(x=>String(x.id)===String(id));const old=c?.name||'';const name=prompt('اسم الشركة الجديد',old);if(!name||name===old)return;try{await api('/admin/companies/'+encodeURIComponent(id),{method:'PATCH',body:{name}});await load()}catch(e){alert(e.message)}};
window.extendCompany=async id=>{const days=Number(prompt('عدد الأيام من الآن',30));if(!days||days<1)return;try{await api('/admin/companies/'+encodeURIComponent(id),{method:'PATCH',body:{durationDays:days}});await load()}catch(e){alert(e.message)}};
$('loginBtn').onclick=doLogin;$('adminPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('companyForm').onsubmit=create;$('search').oninput=render;$('loadBtn').onclick=load;$('refreshBtn').onclick=load;$('logoutBtn').onclick=()=>{sessionStorage.removeItem('ct3_admin_token');token='';$('login').classList.remove('hidden')};$('copyKeyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('secretKey').textContent);$('copyKeyBtn').textContent='تم النسخ'}catch{alert('انسخ المفتاح يدوياً')}};
if(token){$('login').classList.add('hidden');load()}else $('login').classList.remove('hidden');
})();
</script>
</body></html>
